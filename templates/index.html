<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Dictation – Listen &amp; Type</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-yt">YT</span><span class="logo-dict">Dictation</span>
      </div>
      <p class="tagline">Practice listening with any YouTube video</p>
    </div>
  </header>

  <main class="main">

    <!-- ── URL INPUT ───────────────────────────────────────── -->
    <section class="card url-card" id="urlCard">
      <h2 class="section-title">Enter a YouTube video URL</h2>
      <form id="urlForm" class="url-form" autocomplete="off">
        <input
          type="text" id="videoUrl" class="url-input"
          placeholder="https://www.youtube.com/watch?v=..."
          spellcheck="false"
        />
        <button type="submit" class="btn btn-primary" id="startBtn">
          <span id="btnLabel">▶ Start</span>
          <span id="btnSpinner" class="spinner" hidden></span>
        </button>
      </form>
      <p class="error-msg" id="errorMsg" hidden></p>
    </section>

    <!-- ── WORKSPACE ────────────────────────────────────────── -->
    <section class="workspace" id="workspace" hidden>

      <!-- left: video -->
      <div class="video-col">
        <div class="player-wrap">
          <div id="ytPlayer"></div>
        </div>
        <div class="video-meta" id="videoMeta"></div>

        <!-- Language picker -->
        <div class="lang-picker">
          <label for="targetLang">🌐 Translate to:</label>
          <select id="targetLang" class="lang-select" onchange="onLangChange()">

            <optgroup label="🌏 Southeast Asia">
              <option value="vi"  selected>🇻🇳 Vietnamese</option>
              <option value="id">🇮🇩 Indonesian</option>
              <option value="ms">🇲🇾 Malay</option>
              <option value="th">🇹🇭 Thai</option>
              <option value="tl">🇵🇭 Filipino</option>
              <option value="km">🇰🇭 Khmer</option>
              <option value="lo">🇱🇦 Lao</option>
              <option value="my">🇲🇲 Burmese</option>
              <option value="jv">🇮🇩 Javanese</option>
              <option value="su">🇮🇩 Sundanese</option>
              <option value="ceb">🇵🇭 Cebuano</option>
              <option value="ilo">🇵🇭 Ilocano</option>
            </optgroup>

            <optgroup label="🌏 East Asia">
              <option value="zh-CN">🇨🇳 Chinese (Simplified)</option>
              <option value="zh-TW">🇹🇼 Chinese (Traditional)</option>
              <option value="ja">🇯🇵 Japanese</option>
              <option value="ko">🇰🇷 Korean</option>
              <option value="mn">🇲🇳 Mongolian</option>
            </optgroup>

            <optgroup label="🌏 South Asia">
              <option value="hi">🇮🇳 Hindi</option>
              <option value="bn">🇧🇩 Bengali</option>
              <option value="ur">🇵🇰 Urdu</option>
              <option value="pa">🇮🇳 Punjabi</option>
              <option value="gu">🇮🇳 Gujarati</option>
              <option value="mr">🇮🇳 Marathi</option>
              <option value="ta">🇱🇰 Tamil</option>
              <option value="te">🇮🇳 Telugu</option>
              <option value="kn">🇮🇳 Kannada</option>
              <option value="ml">🇮🇳 Malayalam</option>
              <option value="ne">🇳🇵 Nepali</option>
              <option value="si">🇱🇰 Sinhala</option>
              <option value="or">🇮🇳 Odia</option>
              <option value="as">🇮🇳 Assamese</option>
              <option value="bho">🇮🇳 Bhojpuri</option>
              <option value="doi">🇮🇳 Dogri</option>
              <option value="mai">🇮🇳 Maithili</option>
              <option value="sa">🇮🇳 Sanskrit</option>
            </optgroup>

            <optgroup label="🌍 Middle East &amp; Central Asia">
              <option value="ar">🇸🇦 Arabic</option>
              <option value="fa">🇮🇷 Persian</option>
              <option value="tr">🇹🇷 Turkish</option>
              <option value="he">🇮🇱 Hebrew</option>
              <option value="ps">🇦🇫 Pashto</option>
              <option value="ku">🌐 Kurdish</option>
              <option value="hy">🇦🇲 Armenian</option>
              <option value="ka">🇬🇪 Georgian</option>
              <option value="az">🇦🇿 Azerbaijani</option>
              <option value="kk">🇰🇿 Kazakh</option>
              <option value="uz">🇺🇿 Uzbek</option>
              <option value="ky">🇰🇬 Kyrgyz</option>
              <option value="tg">🇹🇯 Tajik</option>
              <option value="tk">🇹🇲 Turkmen</option>
              <option value="ug">🌐 Uyghur</option>
            </optgroup>

            <optgroup label="🌍 Europe — West">
              <option value="en">🇬🇧 English</option>
              <option value="fr">🇫🇷 French</option>
              <option value="de">🇩🇪 German</option>
              <option value="es">🇪🇸 Spanish</option>
              <option value="it">🇮🇹 Italian</option>
              <option value="pt">🇵🇹 Portuguese</option>
              <option value="nl">🇳🇱 Dutch</option>
              <option value="sv">🇸🇪 Swedish</option>
              <option value="da">🇩🇰 Danish</option>
              <option value="no">🇳🇴 Norwegian</option>
              <option value="fi">🇫🇮 Finnish</option>
              <option value="is">🇮🇸 Icelandic</option>
              <option value="ga">🇮🇪 Irish</option>
              <option value="cy">🏴󠁧󠁢󠁷󠁬󠁳󠁿 Welsh</option>
              <option value="gd">🏴󠁧󠁢󠁳󠁣󠁴󠁿 Scottish Gaelic</option>
              <option value="ca">🌐 Catalan</option>
              <option value="eu">🌐 Basque</option>
              <option value="gl">🌐 Galician</option>
              <option value="lb">🇱🇺 Luxembourgish</option>
              <option value="mt">🇲🇹 Maltese</option>
              <option value="af">🇿🇦 Afrikaans</option>
            </optgroup>

            <optgroup label="🌍 Europe — East">
              <option value="ru">🇷🇺 Russian</option>
              <option value="uk">🇺🇦 Ukrainian</option>
              <option value="pl">🇵🇱 Polish</option>
              <option value="cs">🇨🇿 Czech</option>
              <option value="sk">🇸🇰 Slovak</option>
              <option value="ro">🇷🇴 Romanian</option>
              <option value="hu">🇭🇺 Hungarian</option>
              <option value="bg">🇧🇬 Bulgarian</option>
              <option value="hr">🇭🇷 Croatian</option>
              <option value="sr">🇷🇸 Serbian</option>
              <option value="bs">🇧🇦 Bosnian</option>
              <option value="sl">🇸🇮 Slovenian</option>
              <option value="mk">🇲🇰 Macedonian</option>
              <option value="sq">🇦🇱 Albanian</option>
              <option value="el">🇬🇷 Greek</option>
              <option value="lt">🇱🇹 Lithuanian</option>
              <option value="lv">🇱🇻 Latvian</option>
              <option value="et">🇪🇪 Estonian</option>
              <option value="be">🇧🇾 Belarusian</option>
              <option value="yi">🌐 Yiddish</option>
            </optgroup>

            <optgroup label="🌍 Africa">
              <option value="sw">🇹🇿 Swahili</option>
              <option value="am">🇪🇹 Amharic</option>
              <option value="ha">🌐 Hausa</option>
              <option value="ig">🌐 Igbo</option>
              <option value="yo">🌐 Yoruba</option>
              <option value="zu">🇿🇦 Zulu</option>
              <option value="xh">🇿🇦 Xhosa</option>
              <option value="so">🇸🇴 Somali</option>
              <option value="mg">🇲🇬 Malagasy</option>
              <option value="ny">🌐 Chichewa</option>
              <option value="sn">🌐 Shona</option>
              <option value="st">🇿🇦 Sesotho</option>
              <option value="nso">🇿🇦 Sepedi</option>
              <option value="rw">🇷🇼 Kinyarwanda</option>
              <option value="lg">🇺🇬 Luganda</option>
              <option value="om">🇪🇹 Oromo</option>
              <option value="ti">🇪🇹 Tigrinya</option>
              <option value="ee">🌐 Ewe</option>
              <option value="ak">🇬🇭 Akan</option>
              <option value="ln">🇨🇩 Lingala</option>
              <option value="ts">🇿🇦 Tsonga</option>
              <option value="kri">🇸🇱 Krio</option>
            </optgroup>

            <optgroup label="🌎 Americas &amp; Pacific">
              <option value="ht">🇭🇹 Haitian Creole</option>
              <option value="gn">🇵🇾 Guarani</option>
              <option value="qu">🌐 Quechua</option>
              <option value="ay">🌐 Aymara</option>
              <option value="haw">🇺🇸 Hawaiian</option>
              <option value="sm">🇼🇸 Samoan</option>
              <option value="mi">🇳🇿 Maori</option>
            </optgroup>

            <optgroup label="🌐 Other">
              <option value="co">🌐 Corsican</option>
              <option value="eo">🌐 Esperanto</option>
              <option value="la">🌐 Latin</option>
              <option value="hmn">🌐 Hmong</option>
              <option value="lus">🇮🇳 Mizo</option>
              <option value="tt">🇷🇺 Tatar</option>
              <option value="dv">🇲🇻 Dhivehi</option>
              <option value="fy">🇳🇱 Frisian</option>
            </optgroup>

          </select>
        </div>
      </div>

      <!-- right: tabs -->
      <div class="right-col">

        <!-- Tab bar -->
        <div class="tab-bar">
          <button class="tab-btn active" id="tabBtnDict" onclick="switchTab('dict')">
            🎧 Dictation
          </button>
          <button class="tab-btn" id="tabBtnTrans" onclick="switchTab('trans')">
            📋 Transcript
          </button>
        </div>

        <!-- ── DICTATION PANE ──────────────────────────────── -->
        <div class="tab-pane card" id="paneDict">

          <div class="progress-row">
            <span class="seg-counter" id="segCounter">1 / 1</span>
            <span class="overall-score" id="overallScore"></span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>

          <div class="ctrl-row">
            <button class="btn btn-sm btn-outline" id="replayBtn" title="Replay (Ctrl+R)">↩ Replay</button>
            <button class="btn btn-sm btn-outline" id="prevBtn"   title="Previous (Ctrl+←)" disabled>◀ Prev</button>
            <button class="btn btn-sm btn-outline" id="nextBtn"   title="Next (Ctrl+→)">Next ▶</button>
            <label class="toggle">
              <input type="checkbox" id="autoAdvance" />
              <span>Auto advance</span>
            </label>
          </div>

          <div class="status-banner" id="statusBanner" hidden>
            <span id="statusText"></span>
          </div>

          <div class="input-wrap">
            <textarea
              id="dictInput" class="dict-textarea"
              placeholder="Type what you hear..."
              rows="3" spellcheck="false"
            ></textarea>
          </div>

          <div class="action-row">
            <button class="btn btn-success" id="checkBtn">✓ Check</button>
            <button class="btn btn-warn"    id="revealBtn">👁 Show Answer</button>
            <button class="btn btn-ghost"   id="clearBtn">↺ Try Again</button>
          </div>

          <!-- masked answer + translation -->
          <div class="result-area" id="resultArea" style="display:none">
            <div class="word-row"   id="wordRow"></div>
            <div class="result-stat" id="resultStat"></div>
            <div class="vi-block"   id="viBlock" hidden>
              <span class="vi-label" id="viLabel">🌐</span>
              <span class="vi-text" id="viText"></span>
            </div>
          </div>

          <div class="shortcuts">
            <kbd>Enter</kbd> check &nbsp;·&nbsp;
            <kbd>Ctrl+R</kbd> replay &nbsp;·&nbsp;
            <kbd>Ctrl+→</kbd> next
          </div>

        </div><!-- /paneDict -->

        <!-- ── TRANSCRIPT PANE ─────────────────────────────── -->
        <div class="tab-pane card" id="paneTrans" style="display:none">
          <div class="tr-list" id="trList">
            <!-- populated by JS -->
          </div>
          <div class="tr-footer">
            <label class="toggle">
              <input type="checkbox" id="autoScroll" checked />
              <span>Auto scroll</span>
            </label>
          </div>
        </div><!-- /paneTrans -->

      </div><!-- /right-col -->
    </section>

  </main>

  <footer class="footer">
    <p>Practice every day – improve every day 🎧</p>
  </footer>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
